<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hairstyle Simulator — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 8px;
    }

    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ---- layout ---- */
    #app { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      background: var(--primary); color: #fff; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    #logout-btn {
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: .9rem;
    }
    #logout-btn:hover { background: rgba(255,255,255,0.3); }

    nav {
      display: flex; gap: 4px; padding: 12px 24px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    nav button {
      background: none; border: none; padding: 8px 16px; border-radius: var(--radius);
      cursor: pointer; font-size: .9rem; color: var(--muted);
    }
    nav button.active { background: var(--primary); color: #fff; }
    nav button:hover:not(.active) { background: var(--border); }

    main { flex: 1; padding: 24px; max-width: 960px; margin: 0 auto; width: 100%; }

    /* ---- panels ---- */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ---- card ---- */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }

    /* ---- form ---- */
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
    label { font-size: .85rem; color: var(--muted); font-weight: 500; }
    input[type=text], input[type=password], input[type=file] {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: .95rem; background: var(--bg); color: var(--text);
    }
    input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

    /* ---- buttons ---- */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border: none; border-radius: var(--radius);
      font-size: .9rem; cursor: pointer; font-weight: 500; white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-outline {
      background: none; border: 1px solid var(--border); color: var(--text);
    }
    .btn-outline:hover { background: var(--bg); }

    /* ---- table ---- */
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }

    /* ---- hairstyle grid ---- */
    .hairstyle-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px;
    }
    .hairstyle-item {
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: var(--surface);
    }
    .hairstyle-item img {
      width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block;
    }
    .hairstyle-item-footer {
      padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 4px;
    }
    .hairstyle-name { font-size: .85rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---- login ---- */
    #login-screen {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: var(--bg);
    }
    .login-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px; width: 340px;
    }
    .login-box h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .login-box p { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
    .login-box .form-group { margin-bottom: 14px; }
    .login-box .btn { width: 100%; justify-content: center; margin-top: 4px; }

    /* ---- alerts ---- */
    .alert {
      padding: 10px 14px; border-radius: var(--radius); font-size: .9rem;
      margin-bottom: 12px;
    }
    .alert-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

    /* ---- badge ---- */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: .75rem; font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-red { background: #fef2f2; color: var(--danger); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>Hairstyle Simulator</h1>
    <p>Admin portal — sign in to continue</p>
    <div id="login-error" class="alert alert-error hidden"></div>
    <div class="form-group">
      <label for="login-username">Username</label>
      <input id="login-username" type="text" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="login-btn">Sign in</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" class="hidden">
  <header>
    <h1>Hairstyle Simulator — Admin</h1>
    <button id="logout-btn">Sign out</button>
  </header>
  <nav>
    <button class="active" data-panel="hairstyles">Hairstyles</button>
    <button data-panel="operators">Operators</button>
  </nav>
  <main>
    <!-- HAIRSTYLES PANEL -->
    <div class="panel active" id="panel-hairstyles">
      <div class="card">
        <h2>Upload hairstyle</h2>
        <div id="upload-alert"></div>
        <div class="form-row">
          <div class="form-group">
            <label for="hs-name">Name</label>
            <input id="hs-name" type="text" placeholder="e.g. French bob" />
          </div>
          <div class="form-group">
            <label for="hs-file">Image (JPEG / PNG / WebP)</label>
            <input id="hs-file" type="file" accept="image/jpeg,image/png,image/webp" />
          </div>
          <label><input type="checkbox" id="cover-face"> Cover reference face</label>
          <img id="cover-preview" alt="Prepared reference" hidden width="140">
          <button class="btn btn-primary" id="hs-upload-btn">Upload</button>
        </div>
      </div>
      <div class="card">
        <h2>Hairstyle library</h2>
        <div id="hairstyle-grid" class="hairstyle-grid">
          <p style="color:var(--muted);font-size:.9rem">Loading…</p>
        </div>
      </div>
    </div>

    <!-- OPERATORS PANEL -->
    <div class="panel" id="panel-operators">
      <div class="card">
        <h2>Create operator</h2>
        <div id="op-alert"></div>
        <div class="form-row">
          <div class="form-group">
            <label for="op-username">Username</label>
            <input id="op-username" type="text" />
          </div>
          <div class="form-group">
            <label for="op-password">Password</label>
            <input id="op-password" type="password" />
          </div>
          <button class="btn btn-primary" id="op-create-btn">Create</button>
        </div>
      </div>
      <div class="card">
        <h2>Operators</h2>
        <div id="operators-table-wrap">
          <p style="color:var(--muted);font-size:.9rem">Loading…</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  'use strict';

  // -----------------------------------------------------------------------
  // State
  // -----------------------------------------------------------------------
  let token = sessionStorage.getItem('admin_token') || null;

  // -----------------------------------------------------------------------
  // API helpers
  // -----------------------------------------------------------------------
  async function api(method, path, body, isForm) {
    const opts = {
      method,
      headers: {},
    };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body) {
      if (isForm) {
        opts.body = body; // FormData
      } else {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
    }
    const res = await fetch(path, opts);
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || res.statusText);
    return data;
  }

  // -----------------------------------------------------------------------
  // Auth
  // -----------------------------------------------------------------------
  async function login() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    clearAlert('login-error');
    try {
      const fd = new URLSearchParams();
      fd.append('username', username);
      fd.append('password', password);
      const res = await fetch('/api/auth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: fd,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed');
      // Decode role from JWT payload
      const payload = JSON.parse(atob(data.access_token.split('.')[1]));
      if (payload.role !== 'admin') throw new Error('This portal is for admins only');
      token = data.access_token;
      sessionStorage.setItem('admin_token', token);
      showApp();
    } catch (err) {
      showAlert('login-error', err.message, 'error');
    }
  }

  function logout() {
    token = null;
    sessionStorage.removeItem('admin_token');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
  }

  // -----------------------------------------------------------------------
  // UI helpers
  // -----------------------------------------------------------------------
  function showApp() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadHairstyles();
    loadOperators();
  }

  function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'alert alert-' + (type === 'error' ? 'error' : 'success');
    el.classList.remove('hidden');
  }

  function clearAlert(id) {
    const el = document.getElementById(id);
    el.classList.add('hidden');
    el.textContent = '';
  }

  // -----------------------------------------------------------------------
  // Nav tabs
  // -----------------------------------------------------------------------
  document.querySelectorAll('nav button[data-panel]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    });
  });

  // -----------------------------------------------------------------------
  // Hairstyles
  // -----------------------------------------------------------------------
  async function loadHairstyles() {
    const grid = document.getElementById('hairstyle-grid');
    try {
      const list = await api('GET', '/api/hairstyles');
      if (!list.length) {
        grid.innerHTML = '<p style="color:var(--muted);font-size:.9rem">No hairstyles yet. Upload one above.</p>';
        return;
      }
      grid.innerHTML = '';
      list.forEach(hs => {
        const item = document.createElement('div');
        item.className = 'hairstyle-item';
        item.innerHTML = `
          <img 
               alt="${esc(hs.name)}"
               loading="lazy"
               onerror="this.style.background='var(--bg)';this.removeAttribute('src')" />
          <div class="hairstyle-item-footer">
            <span class="hairstyle-name" title="${esc(hs.name)}">${esc(hs.name)}</span>
            <button class="btn btn-danger" style="padding:4px 10px;font-size:.8rem"
                    data-id="${hs.id}">Del</button>
          </div>`;
        fetch('/api/hairstyles/' + hs.id + '/image', {headers: {Authorization: 'Bearer ' + token}})
          .then(r => r.ok ? r.blob() : Promise.reject()).then(b => item.querySelector('img').src = URL.createObjectURL(b)).catch(() => {});
        item.querySelector('button').hidden = hs.id < 0;
        item.querySelector('button').addEventListener('click', () => deleteHairstyle(hs.id, item));
        grid.appendChild(item);
      });
    } catch (err) {
      grid.innerHTML = '<p style="color:var(--danger)">' + esc(err.message) + '</p>';
    }
  }

  let coverRevision = 0;
  async function refreshCover() {
    const revision = ++coverRevision;
    const image = document.getElementById('cover-preview');
    const upload = document.getElementById('hs-upload-btn');
    URL.revokeObjectURL(image.src);
    image.hidden = true;
    upload.disabled = false;
    const file = document.getElementById('hs-file').files[0];
    if (!file || !document.getElementById('cover-face').checked) return;
    upload.disabled = true;
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/admin/hairstyles/cover-preview', {
        method: 'POST', headers: {Authorization: 'Bearer ' + token}, body: form
      });
      if (!res.ok) throw new Error((await res.json()).detail);
      const blob = await res.blob();
      if (revision !== coverRevision) return;
      image.src = URL.createObjectURL(blob);
      image.hidden = false;
      upload.disabled = false;
    } catch (e) {
      if (revision === coverRevision) showAlert('upload-alert', e.message, 'error');
    }
  }
  for (const id of ['hs-file', 'cover-face']) document.getElementById(id).onchange = refreshCover;

  async function uploadHairstyle() {
    const name = document.getElementById('hs-name').value.trim();
    const fileInput = document.getElementById('hs-file');
    clearAlert('upload-alert');
    if (!name) { showAlert('upload-alert', 'Name is required', 'error'); return; }
    if (!fileInput.files.length) { showAlert('upload-alert', 'Please select an image', 'error'); return; }
    const fd = new FormData();
    fd.append('name', name);
    fd.append('cover_face', document.getElementById('cover-face').checked);
    fd.append('file', fileInput.files[0]);
    try {
      await api('POST', '/api/admin/hairstyles', fd, true);
      showAlert('upload-alert', 'Hairstyle uploaded successfully', 'success');
      document.getElementById('hs-name').value = '';
      fileInput.value = '';
      document.getElementById('cover-face').checked = false;
      refreshCover();
      loadHairstyles();
    } catch (err) {
      showAlert('upload-alert', err.message, 'error');
    }
  }

  async function deleteHairstyle(id, el) {
    if (!confirm('Delete this hairstyle?')) return;
    try {
      await api('DELETE', '/api/admin/hairstyles/' + id);
      el.remove();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  // -----------------------------------------------------------------------
  // Operators
  // -----------------------------------------------------------------------
  async function loadOperators() {
    const wrap = document.getElementById('operators-table-wrap');
    try {
      const list = await api('GET', '/api/admin/operators');
      if (!list.length) {
        wrap.innerHTML = '<p style="color:var(--muted);font-size:.9rem">No operators yet.</p>';
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead><tr>
            <th>ID</th><th>Username</th><th>Status</th><th>Created</th><th>Actions</th>
          </tr></thead>
          <tbody id="op-tbody"></tbody>
        </table>`;
      const tbody = document.getElementById('op-tbody');
      list.forEach(op => renderOperatorRow(op, tbody));
    } catch (err) {
      wrap.innerHTML = '<p style="color:var(--danger)">' + esc(err.message) + '</p>';
    }
  }

  function renderOperatorRow(op, tbody) {
    const tr = document.createElement('tr');
    tr.id = 'op-row-' + op.id;
    const statusBadge = op.is_active
      ? '<span class="badge badge-green">Active</span>'
      : '<span class="badge badge-red">Inactive</span>';
    const toggleLabel = op.is_active ? 'Deactivate' : 'Activate';
    tr.innerHTML = `
      <td>${op.id}</td>
      <td>${esc(op.username)}</td>
      <td>${statusBadge}</td>
      <td style="color:var(--muted);font-size:.85rem">${op.created_at.slice(0,10)}</td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-outline" style="font-size:.8rem;padding:4px 10px"
                data-toggle="${op.id}" data-active="${op.is_active}">${toggleLabel}</button>
        <button class="btn btn-danger" style="font-size:.8rem;padding:4px 10px"
                data-delete="${op.id}">Delete</button>
      </td>`;
    tr.querySelector('[data-toggle]').addEventListener('click', () =>
      toggleOperator(op.id, op.is_active));
    tr.querySelector('[data-delete]').addEventListener('click', () =>
      deleteOperator(op.id, tr));
    tbody.appendChild(tr);
  }

  async function createOperator() {
    const username = document.getElementById('op-username').value.trim();
    const password = document.getElementById('op-password').value;
    clearAlert('op-alert');
    if (!username || !password) { showAlert('op-alert', 'Username and password required', 'error'); return; }
    try {
      await api('POST', '/api/admin/operators', { username, password });
      showAlert('op-alert', 'Operator created', 'success');
      document.getElementById('op-username').value = '';
      document.getElementById('op-password').value = '';
      loadOperators();
    } catch (err) {
      showAlert('op-alert', err.message, 'error');
    }
  }

  async function toggleOperator(id, currentActive) {
    try {
      await api('PUT', '/api/admin/operators/' + id, { is_active: !currentActive });
      loadOperators();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  async function deleteOperator(id, tr) {
    if (!confirm('Permanently delete this operator?')) return;
    try {
      await api('DELETE', '/api/admin/operators/' + id);
      tr.remove();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  // -----------------------------------------------------------------------
  // Utility
  // -----------------------------------------------------------------------
  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // -----------------------------------------------------------------------
  // Event wiring
  // -----------------------------------------------------------------------
  document.getElementById('login-btn').addEventListener('click', login);
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('hs-upload-btn').addEventListener('click', uploadHairstyle);
  document.getElementById('op-create-btn').addEventListener('click', createOperator);

  // -----------------------------------------------------------------------
  // Auto-login if token in session storage
  // -----------------------------------------------------------------------
  if (token) {
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      if (payload.exp * 1000 > Date.now() && payload.role === 'admin') {
        showApp();
      } else {
        logout();
      }
    } catch {
      logout();
    }
  }
</script>
</body>
</html>
